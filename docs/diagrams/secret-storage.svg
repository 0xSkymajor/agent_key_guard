<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8FD0FF"/>
  </marker>
  <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10173A"/><stop offset="1" stop-color="#0A0E26"/>
  </linearGradient>
</defs>
<rect width="1200" height="720" fill="#05081C"/>
<rect width="1200" height="720" fill="url(#g1)" opacity=".55"/>
<text x="48" y="64" fill="#EBF2FF" font-size="27" font-weight="700">凭证是怎么保存的</text>
<text x="48" y="92" fill="#6C7C9F" font-size="14">磁盘上只有密文；解密只发生在内存里，而且只在请求发出的那一刻</text>

<!-- step chain -->
<rect x="48" y="132" width="196" height="116" rx="14" fill="#0B1035" stroke="#8FD0FF" stroke-opacity=".35"/>
<text x="70" y="164" fill="#EBF2FF" font-size="15" font-weight="700">① 主密码</text>
<text x="70" y="188" fill="#A8B8D8" font-size="11.5">只在登录时输入</text>
<text x="70" y="208" fill="#A8B8D8" font-size="11.5">从不写入磁盘</text>

<rect x="292" y="132" width="196" height="116" rx="14" fill="#0B1035" stroke="#8FD0FF" stroke-opacity=".35"/>
<text x="314" y="164" fill="#EBF2FF" font-size="15" font-weight="700">② scrypt 派生</text>
<text x="314" y="188" fill="#A8B8D8" font-size="11.5">加盐、慢哈希</text>
<text x="314" y="208" fill="#A8B8D8" font-size="11.5">得到数据密钥</text>

<rect x="536" y="132" width="230" height="116" rx="14" fill="#0B1035" stroke="#8FD0FF" stroke-opacity=".35"/>
<text x="558" y="164" fill="#EBF2FF" font-size="15" font-weight="700">③ AES-GCM 加密</text>
<text x="558" y="188" fill="#A8B8D8" font-size="11.5">vault.enc = 密文 + 认证标签</text>
<text x="558" y="208" fill="#A8B8D8" font-size="11.5">篡改即解不开</text>

<rect x="814" y="132" width="338" height="116" rx="14" fill="#0B1035" stroke="#3BE0A8" stroke-opacity=".4"/>
<text x="836" y="164" fill="#3BE0A8" font-size="15" font-weight="700">④ 磁盘上只有密文</text>
<text x="836" y="188" fill="#A8B8D8" font-size="11.5">备份 / 拷贝 / 被 AI 读走，都只是乱码</text>
<text x="836" y="208" fill="#A8B8D8" font-size="11.5">错误主密码 → 解不开，不是「校验失败」</text>

<path d="M244 190 L286 190" stroke="#8FD0FF" stroke-width="2" marker-end="url(#ar)"/>
<path d="M488 190 L530 190" stroke="#8FD0FF" stroke-width="2" marker-end="url(#ar)"/>
<path d="M766 190 L808 190" stroke="#8FD0FF" stroke-width="2" marker-end="url(#ar)"/>

<!-- runtime -->
<rect x="48" y="292" width="540" height="196" rx="16" fill="#0D1330" stroke="#8FD0FF" stroke-opacity=".45"/>
<text x="72" y="326" fill="#EBF2FF" font-size="16" font-weight="700">运行时：只在内存里解开</text>
<text x="72" y="354" fill="#A8B8D8" font-size="12">· 启动/登录后解密一次，密钥留在进程内存</text>
<text x="72" y="378" fill="#A8B8D8" font-size="12">· 注入发生在 Broker 建立出站连接前的一瞬间</text>
<text x="72" y="402" fill="#A8B8D8" font-size="12">· 出站请求完成后即丢弃，不写临时文件</text>
<text x="72" y="426" fill="#A8B8D8" font-size="12">· 接口一律回显字段名 / 掩码，不回显值</text>
<text x="72" y="458" fill="#FFC24B" font-size="12">服务重启 → 保险库回到锁定态，需要人再登录一次</text>

<rect x="620" y="292" width="532" height="196" rx="16" fill="#0D1330" stroke="#FFC24B" stroke-opacity=".4"/>
<text x="644" y="326" fill="#EBF2FF" font-size="16" font-weight="700">查看单条明文：再过一道 TOTP</text>
<text x="644" y="354" fill="#A8B8D8" font-size="12">· 工作台点眼睛 → 输入 6 位动态码</text>
<text x="644" y="378" fill="#A8B8D8" font-size="12">· 发放一次性 reveal_token：15 秒、绑来源 IP</text>
<text x="644" y="402" fill="#A8B8D8" font-size="12">· 明文只显示一次，关闭即失效</text>
<text x="644" y="426" fill="#A8B8D8" font-size="12">· 查看动作进审计：谁、何时、看了哪条</text>

<!-- disk inventory -->
<rect x="48" y="516" width="1104" height="150" rx="16" fill="#0B1035" stroke="#8FD0FF" stroke-opacity=".25"/>
<text x="72" y="548" fill="#EBF2FF" font-size="15" font-weight="700">数据目录里实际有什么</text>
<text x="72" y="578" fill="#A8B8D8" font-size="12">vault.enc — 加密后的凭证与配置（唯一真值载体）</text>
<text x="420" y="578" fill="#A8B8D8" font-size="12">master.key — 可选，机器绑定的附加密钥</text>
<text x="760" y="578" fill="#A8B8D8" font-size="12">ca/ — 自签 CA 与服务器证书</text>
<text x="72" y="604" fill="#A8B8D8" font-size="12">audit.log — 动作摘要，不含明文</text>
<text x="420" y="604" fill="#A8B8D8" font-size="12">portal-state.json — 登录/TOTP 重放防护状态</text>
<text x="760" y="604" fill="#6C7C9F" font-size="12">（没有 .env、没有明文配置）</text>
<text x="72" y="638" fill="#4E5C7C" font-size="12">换主密码 = 用新派生密钥重加密 vault；旧密码立即失效，无需逐条重录。</text>
</svg>
