<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8FD0FF"/>
  </marker>
  <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10173A"/><stop offset="1" stop-color="#0A0E26"/>
  </linearGradient>
</defs>
<rect width="1200" height="720" fill="#05081C"/>
<rect width="1200" height="720" fill="url(#g1)" opacity=".55"/>
<text x="48" y="64" fill="#EBF2FF" font-size="27" font-weight="700">数据流向：真值只在 Broker 里</text>
<text x="48" y="92" fill="#6C7C9F" font-size="14">Agent 侧只有地址；凭证由 Broker 在请求发出的瞬间注入，审批通过才执行</text>

<!-- Agent -->
<rect x="48" y="150" width="270" height="182" rx="14" fill="#0B1035" stroke="#8FD0FF" stroke-opacity=".35"/>
<text x="72" y="184" fill="#EBF2FF" font-size="17" font-weight="700">Agent</text>
<text x="72" y="206" fill="#6C7C9F" font-size="12">Claude / DeepSeek / 任何 AI</text>
<text x="72" y="238" fill="#A8B8D8" font-size="12">· 只有 AGENTKEYGUARD_ENV_URL</text>
<text x="72" y="260" fill="#A8B8D8" font-size="12">· 调 /pg /ssh /git 执行请求</text>
<text x="72" y="282" fill="#A8B8D8" font-size="12">· 拿不到任何明文密码 / Token</text>
<text x="72" y="312" fill="#FFC24B" font-size="12">这正是设计目标</text>

<!-- Broker -->
<rect x="430" y="120" width="360" height="292" rx="16" fill="#0D1330" stroke="#8FD0FF" stroke-opacity=".55"/>
<text x="456" y="158" fill="#EBF2FF" font-size="18" font-weight="700">Broker（本机 HTTPS :7700）</text>
<text x="456" y="182" fill="#6C7C9F" font-size="12">单进程 · 标准库 · 无外部依赖</text>
<rect x="456" y="200" width="308" height="34" rx="8" fill="#131B44" stroke="#8FD0FF" stroke-opacity=".18"/>
<text x="470" y="223" fill="#C4E7FF" font-size="12">规则引擎：绝对禁区 / 高危 / 交互式</text>
<rect x="456" y="242" width="308" height="34" rx="8" fill="#131B44" stroke="#8FD0FF" stroke-opacity=".18"/>
<text x="470" y="265" fill="#C4E7FF" font-size="12">审批队列：请求挂起直到人拍板</text>
<rect x="456" y="284" width="308" height="34" rx="8" fill="#131B44" stroke="#8FD0FF" stroke-opacity=".18"/>
<text x="470" y="307" fill="#C4E7FF" font-size="12">适配器：pg / mysql / redis / ssh / git</text>
<rect x="456" y="326" width="308" height="34" rx="8" fill="#131B44" stroke="#8FD0FF" stroke-opacity=".18"/>
<text x="470" y="349" fill="#C4E7FF" font-size="12">vault.enc：加密存放，运行时才解密</text>
<text x="456" y="390" fill="#6C7C9F" font-size="11">审计落盘 audit.log（动作摘要，不含明文）</text>

<!-- Targets -->
<rect x="884" y="150" width="268" height="182" rx="14" fill="#0B1035" stroke="#8FD0FF" stroke-opacity=".35"/>
<text x="908" y="184" fill="#EBF2FF" font-size="17" font-weight="700">目标系统</text>
<text x="908" y="212" fill="#A8B8D8" font-size="12">PostgreSQL / MySQL / Redis</text>
<text x="908" y="234" fill="#A8B8D8" font-size="12">SSH 主机 / Gitea 仓库</text>
<text x="908" y="266" fill="#6C7C9F" font-size="11">连接由 Broker 发起</text>
<text x="908" y="288" fill="#6C7C9F" font-size="11">Agent 不直接连这些机器</text>

<!-- phone + browser -->
<rect x="430" y="470" width="170" height="150" rx="14" fill="#0B1035" stroke="#FFC24B" stroke-opacity=".4"/>
<text x="452" y="502" fill="#EBF2FF" font-size="15" font-weight="700">手机（Bark）</text>
<text x="452" y="526" fill="#A8B8D8" font-size="11.5">收到审批推送</text>
<text x="452" y="548" fill="#A8B8D8" font-size="11.5">点链接 → /approve</text>
<text x="452" y="570" fill="#A8B8D8" font-size="11.5">同意 / 拒绝（可带理由）</text>

<rect x="620" y="470" width="170" height="150" rx="14" fill="#0B1035" stroke="#8FD0FF" stroke-opacity=".3"/>
<text x="642" y="502" fill="#EBF2FF" font-size="15" font-weight="700">浏览器工作台</text>
<text x="642" y="526" fill="#A8B8D8" font-size="11.5">审批 / 凭证 / 服务</text>
<text x="642" y="548" fill="#A8B8D8" font-size="11.5">Agent 接入 / 设置</text>
<text x="642" y="570" fill="#A8B8D8" font-size="11.5">查看会话与审计</text>

<!-- arrows -->
<path d="M318 214 L424 214" stroke="#8FD0FF" stroke-width="2" marker-end="url(#ar)"/>
<text x="318" y="200" fill="#8FD0FF" font-size="11.5">① 取 env / 发执行请求</text>
<path d="M790 300 L878 300" stroke="#3BE0A8" stroke-width="2" marker-end="url(#ar)"/>
<text x="792" y="286" fill="#3BE0A8" font-size="11.5" text-anchor="end">② 审批通过后才注入并执行</text>
<path d="M610 412 L560 464" stroke="#FFC24B" stroke-width="2" marker-end="url(#ar)"/>
<text x="600" y="444" fill="#FFC24B" font-size="11.5">③ 推送审批通知</text>
<path d="M560 470 L600 412" stroke="#FFC24B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="470" y="452" fill="#FFC24B" font-size="11.5">④ 点链接拍板</text>
<path d="M700 412 L705 464" stroke="#8FD0FF" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="712" y="444" fill="#8FD0FF" font-size="11.5">人工审批</text>

<text x="48" y="676" fill="#4E5C7C" font-size="12">核心不变量：Agent 进程内存、日志、抓包里都不出现明文凭证 —— 真值只在 Broker 发请求的那一刻存在。</text>
</svg>
