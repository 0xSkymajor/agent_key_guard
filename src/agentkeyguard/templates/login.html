<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05081C">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<title>登录 · AgentKeyGuard</title>
<style>
/* ============================================================
   AgentKeyGuard · 登录页
   两套版式：≥1100 网页版（双栏 + 协作流）／<1100 M 站（单栏，不塞动画）
   鸟群是整页背景，不再关在 logo 里
   ============================================================ */
:root{
  --ink-0:#03050F; --ink-1:#05081C; --ink-2:#070B26; --ink-3:#0B1035;
  --brand-900:#000F5B; --brand-700:#344DC9; --brand-600:#4D6BFE;
  --brand-500:#5B7BFF; --brand-300:#8FD0FF; --brand-200:#C4E7FF;
  --text:#EBF2FF; --text-2:#A8B8D8; --text-3:#6C7C9F; --text-4:#6C7C9F;
  --line:rgba(143,208,255,.14); --line-2:rgba(143,208,255,.30);
  --ok:#3BE0A8; --warn:#FFC24B; --danger:#FF7A93;
  --r-sm:8px; --r-md:10px; --r-lg:14px;
  --font:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
:root{--frame:min(100vw,1720px)}   /* 超宽屏构图框架：内容最大 1720，两侧留给氛围 */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--text); font-family:var(--font); font-size:14px; line-height:1.5;
  background:var(--ink-0); overflow-x:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}

/* ---------- 0 底色 ---------- */
.bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:
    radial-gradient(1200px 760px at 10% 14%, rgba(77,107,254,.30), transparent 62%),
    radial-gradient(980px 660px at 74% 104%, rgba(108,77,254,.20), transparent 64%),
    radial-gradient(760px 480px at 96% 6%, rgba(143,208,255,.09), transparent 62%),
    linear-gradient(158deg,#060A24 0%,#05081C 46%,#03050F 100%);
}
.bg::before{content:""; position:absolute; left:-18vw; top:6vh; width:72vw; height:86vh;
  border-radius:48% 52% 58% 42% / 56% 44% 56% 44%;
  background:linear-gradient(140deg, rgba(77,107,254,.62), rgba(52,77,201,.14) 64%, rgba(108,77,254,0) 80%);
  filter:blur(66px); opacity:.6; animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) rotate(-2deg)}to{transform:translate3d(2.4vw,-1.6vh,0) rotate(2.6deg)}}

/* ---------- 1 鸟群：整页背景 ---------- */
#boids{position:fixed; inset:0; z-index:1; width:100%; height:100%;
  pointer-events:none; opacity:.70}

/* ---------- 2 右侧压暗，保证表单可读 ---------- */
.veil{position:fixed; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(48% 62% at 76% 46%, rgba(3,5,15,.90) 0%, rgba(3,5,15,.55) 42%, rgba(3,5,15,0) 72%)}

/* ---------- 3 守护者水印：尺寸连续、位置平滑换边 ---------- */
.guard{position:fixed; z-index:3; left:calc((100vw - var(--frame)) / 2); bottom:0;
  width:clamp(200px, min(56vw, 78vh), 980px);
  transform:translate3d(-8vw, 6vh, 0);
  transition:transform 850ms cubic-bezier(.22,.8,.2,1);
  pointer-events:none}
.guard svg{width:100%; height:auto; display:block;
  filter:blur(2.4px) saturate(1.06); opacity:.58;
  transition:opacity 600ms, filter 600ms;
  animation:float 24s ease-in-out infinite alternate}
@keyframes float{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(12px,-10px,0) scale(1.015)}}

/* ---------- 4 主布局：网页版 ---------- */
.page{position:relative; z-index:4; width:100%; max-width:1720px; margin:0 auto;
  min-height:100vh; min-height:100dvh;
  display:grid; grid-template-columns:minmax(0,1fr) 420px;
  align-items:center; gap:72px;
  padding:40px 56px 52px}
.panel{grid-column:2; justify-self:end; width:100%; max-width:420px; min-width:0;
  animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}

/* 品牌：logo 不套框，就让它站在字标旁边 */
.brand{display:flex; align-items:center; gap:13px}
.brand .mk{position:relative; width:48px; height:48px; flex:0 0 48px}
.brand .mk::before{content:""; position:absolute; inset:-34%; border-radius:50%; z-index:-1;
  background:radial-gradient(50% 50% at 50% 50%, rgba(77,107,254,.34), rgba(77,107,254,0) 72%);
  filter:blur(7px)}
.brand .mk svg{width:100%; height:100%; display:block;
  filter:brightness(1.42) saturate(1.08) drop-shadow(0 8px 22px rgba(77,107,254,.55))}
.wordmark{margin:0; font-size:clamp(31px,2.7vw,41px); line-height:1.04; font-weight:800;
  letter-spacing:-.022em;
  background:linear-gradient(96deg,#EAF6FF 6%,#8FD0FF 44%,#5B7BFF 96%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  -webkit-text-fill-color:transparent}
.slogan{margin:15px 0 0}
.slogan .zh{margin:0; font-size:16.5px; line-height:1.62; color:var(--text-2); letter-spacing:.01em}
.slogan .en{margin:7px 0 0; font-size:12.5px; line-height:1.5; color:var(--text-3);
  letter-spacing:.02em; text-align:right}
.rule{height:1px; margin:24px 0 2px;
  background:linear-gradient(90deg, rgba(143,208,255,.32), rgba(143,208,255,.05) 72%, transparent)}

/* ---------- 表单 ---------- */
.field{margin-top:17px}
.field label, .lbl{display:block; font-size:12px; letter-spacing:.07em; color:var(--text-2); margin:0 0 8px}
.inp{position:relative}
.inp input{width:100%; height:44px; padding:0 14px; border-radius:var(--r-md);
  color:var(--text); font-size:15px; font-family:inherit; background:rgba(255,255,255,.035);
  border:1px solid var(--line); transition:border-color .18s, box-shadow .18s, background .18s}
.inp input::placeholder{color:var(--text-4)}
.inp input:hover{border-color:rgba(143,208,255,.22)}
.inp input:focus{outline:none; border-color:var(--brand-300); background:rgba(255,255,255,.055);
  box-shadow:0 0 0 4px rgba(77,107,254,.18)}
.inp input:disabled{opacity:.55; cursor:not-allowed}
.inp input[type=password]{letter-spacing:.12em}
.uniq{margin-left:7px; font-size:10px; color:var(--text-4); border:1px solid var(--line);
  padding:1px 7px; border-radius:999px; letter-spacing:.02em; vertical-align:1px}
.eye{position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; display:grid; place-items:center; border:0; border-radius:var(--r-sm);
  background:transparent; color:var(--text-3); cursor:pointer; transition:color .15s, background .15s}
.eye:hover{color:var(--brand-300); background:rgba(143,208,255,.08)}
.eye:focus-visible{outline:2px solid var(--brand-300); outline-offset:1px}
.eye svg{width:16px; height:16px; display:block}

.keep{display:flex; align-items:center; gap:9px; margin:15px 0 2px; cursor:pointer;
  font-size:13px; color:#C6D4EC; user-select:none}
.keep input{position:absolute; opacity:0; width:0; height:0}
.keep .box{width:16px; height:16px; flex:0 0 16px; border-radius:5px;
  border:1px solid rgba(143,208,255,.32); background:rgba(255,255,255,.03); position:relative;
  transition:border-color .15s, background .15s, box-shadow .15s}
.keep .box::after{content:""; position:absolute; left:5px; top:2px; width:4px; height:8px;
  border:solid #05122E; border-width:0 2px 2px 0; transform:rotate(45deg) scale(.4); opacity:0;
  transition:opacity .12s, transform .12s}
.keep input:checked + .box{background:var(--brand-300); border-color:var(--brand-300)}
.keep input:checked + .box::after{opacity:1; transform:rotate(45deg) scale(1)}
.keep input:focus-visible + .box{box-shadow:0 0 0 4px rgba(77,107,254,.25)}
.keep .tip{margin-left:auto; font-size:11px; color:var(--text-4)}

.totp{display:flex; gap:10px}
.totp input{flex:1 1 0; width:auto; min-width:0; height:auto; aspect-ratio:5/6; padding:0; text-align:center;
  font-size:22px; font-weight:600; font-family:var(--mono); font-variant-numeric:tabular-nums;
  color:var(--text); background:rgba(255,255,255,.035); border:1px solid var(--line);
  border-radius:var(--r-md); caret-color:var(--brand-300);
  transition:border-color .15s, box-shadow .15s, background .15s}
.totp input:focus{outline:none; border-color:var(--brand-300); background:rgba(255,255,255,.06);
  box-shadow:0 0 0 4px rgba(77,107,254,.18)}
.totp input.filled{background:rgba(143,208,255,.10); border-color:rgba(143,208,255,.34)}

.err{min-height:19px; margin:11px 0 0; font-size:12.5px; line-height:1.5; color:var(--danger)}
.err.warn{color:var(--warn)}
.locked{margin:11px 0 0; padding:9px 12px; border-radius:var(--r-md); font-size:12px; line-height:1.55;
  color:#FFD79A; background:rgba(255,194,75,.08); border:1px solid rgba(255,194,75,.24)}
.locked[hidden]{display:none}

.btn-main{margin-top:20px; width:100%; height:48px; border:0; border-radius:var(--r-md);
  font-family:inherit; font-size:15px; font-weight:700; letter-spacing:.03em; color:#061029;
  background:linear-gradient(96deg,#B7E4FF 0%,#8FD0FF 34%,#5B8DFF 100%);
  box-shadow:0 10px 30px rgba(77,107,254,.30), inset 0 1px 0 rgba(255,255,255,.55);
  cursor:pointer; transition:filter .15s, transform .12s, box-shadow .2s}
.btn-main:hover:not(:disabled){filter:brightness(1.07); box-shadow:0 14px 38px rgba(77,107,254,.42)}
.btn-main:active:not(:disabled){transform:translateY(1px)}
.btn-main:disabled{opacity:.55; cursor:not-allowed}
.btn-main:focus-visible{outline:2px solid var(--brand-200); outline-offset:3px}

/* 版本号：放进面板流内，任何窗口高度都不会压到内容 */
.ver{margin:16px 0 0; text-align:right; font-size:11px; color:var(--text-4);
  font-variant-numeric:tabular-nums; letter-spacing:.04em}

/* 左栏留白填充（?pad=A 才出现） */
.manifesto{display:none; grid-column:1; align-self:center; max-width:340px; margin:0 0 0 6px}
body.pad-a .manifesto{display:block}
.manifesto p{margin:0 0 16px; padding:0 0 0 14px; border-left:1px solid rgba(143,208,255,.20);
  font-size:12px; line-height:1.65; color:var(--text-3)}
.manifesto p:last-child{margin-bottom:0}
.manifesto b{display:block; margin-bottom:2px; color:var(--text-2); font-size:12.5px; font-weight:600; letter-spacing:.04em}
@media (max-width:1099px){ .manifesto{display:none !important} }

/* ============================================================
   协作流：只在网页版出现（M 站不塞动画）
   ============================================================ */
.stream{display:none}

@media (min-width:1100px){
  .stream{display:block; position:fixed; z-index:5;
    left:calc((100vw - var(--frame)) / 2 + 56px); bottom:46px; width:420px;
    animation:rise .8s .16s cubic-bezier(.2,.8,.2,1) both}
  .stream-head{display:flex; align-items:center; gap:7px; margin-bottom:9px;
    padding-left:2px}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--brand-300);
    box-shadow:0 0 0 0 rgba(143,208,255,.42); animation:pulse 2.6s ease-out infinite}
  .stream-title{font-size:11px; letter-spacing:.15em; color:var(--text-2);
    text-transform:uppercase; text-shadow:0 1px 8px rgba(3,5,15,.8)}
}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(143,208,255,.40)}70%{box-shadow:0 0 0 7px rgba(143,208,255,0)}100%{box-shadow:0 0 0 0 rgba(143,208,255,0)}}

.feed{position:relative; height:300px; overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, rgba(0,0,0,.35) 9%, #000 30%, #000 100%);
  mask-image:linear-gradient(to bottom, transparent 0, rgba(0,0,0,.35) 9%, #000 30%, #000 100%)}
.scroller{height:100%; padding:6px 2px 0; overflow-y:auto; overscroll-behavior:contain;
  scrollbar-width:none; -ms-overflow-style:none; scroll-behavior:smooth}
.scroller::-webkit-scrollbar{display:none}

.item{position:relative; margin-bottom:9px; padding:9px 12px; border-radius:12px;
  background:linear-gradient(180deg, rgba(13,19,50,.88), rgba(8,11,34,.84));
  border:1px solid rgba(143,208,255,.13);
  box-shadow:0 12px 28px rgba(2,4,18,.42), inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(10px); overflow:hidden;
  opacity:0; transform:translateY(16px) scale(.985); filter:blur(2px);
  transition:opacity .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1), filter .5s}
.item.in{opacity:1; transform:none; filter:none}
.item::after{content:""; position:absolute; top:0; bottom:0; width:34%; left:-40%;
  background:linear-gradient(90deg, transparent, rgba(143,208,255,.30), rgba(196,231,255,.55), rgba(143,208,255,.22), transparent);
  transform:skewX(-14deg); opacity:0; pointer-events:none}
.item.in::after{animation:slash .85s cubic-bezier(.2,.7,.2,1) .05s 1 both}
@keyframes slash{0%{left:-40%; opacity:0}18%{opacity:.9}55%{opacity:.55}100%{left:118%; opacity:0}}
.ghost{position:absolute; left:40px; top:9px; font-family:var(--mono); font-size:12.5px;
  color:#BFE3FF; opacity:.5; filter:blur(4px); pointer-events:none;
  animation:afterimage 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes afterimage{0%{opacity:.55; transform:translateY(12px)}70%{opacity:.18}100%{opacity:0; transform:translateY(-16px)}}

.i-head{display:flex; align-items:center; gap:9px}
.ico{width:22px; height:22px; flex:0 0 22px; border-radius:7px; display:grid; place-items:center;
  font-size:12px; font-weight:700; line-height:1}
.ico.x{color:var(--danger); background:rgba(255,122,147,.12); border:1px solid rgba(255,122,147,.30)}
.ico.ok{color:var(--ok); background:rgba(59,224,168,.12); border:1px solid rgba(59,224,168,.30)}
.ico.q{color:var(--warn); background:rgba(255,194,75,.12); border:1px solid rgba(255,194,75,.30)}
.i-body{min-width:0; flex:1}
.i-cmd{font-family:var(--mono); font-size:12.5px; color:#E4EEFF; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.i-meta{font-size:11px; color:var(--text-3); margin-top:1px}
.tag{margin-left:auto; font-family:var(--mono); font-size:10.5px; letter-spacing:.05em;
  padding:2px 7px; border-radius:999px; white-space:nowrap; opacity:0; transform:scale(.86);
  transition:opacity .3s, transform .3s}
.tag.on{opacity:1; transform:none}
.tag-x{color:var(--danger); background:rgba(255,122,147,.10); border:1px solid rgba(255,122,147,.30)}
.tag-ok{color:var(--ok); background:rgba(59,224,168,.10); border:1px solid rgba(59,224,168,.30)}
.tag-428{color:var(--warn); background:rgba(255,194,75,.10); border:1px solid rgba(255,194,75,.30)}

.qs{display:flex; gap:6px; margin:9px 0 0 31px; flex-wrap:wrap}
.qs .q{font-size:11px; color:#FFE0A8; padding:2px 8px; border-radius:999px;
  background:rgba(255,194,75,.09); border:1px solid rgba(255,194,75,.24);
  opacity:0; transform:translateY(4px); transition:opacity .35s, transform .35s}
.qs .q.on{opacity:1; transform:none}
.ans{margin:9px 0 0 31px; padding-left:10px; border-left:2px solid rgba(143,208,255,.30);
  font-size:11.5px; line-height:1.55; color:#C6D6F0; min-height:18px}
.ans b{color:var(--brand-300); font-weight:600}
.res{margin:7px 0 0 31px; display:flex; align-items:center; gap:7px; font-size:11px; color:#B9F3DC;
  opacity:0; transform:translateY(3px); transition:opacity .35s, transform .35s}
.res.on{opacity:1; transform:none}
.res .tick{width:16px; height:16px; border-radius:50%; display:grid; place-items:center;
  background:rgba(59,224,168,.16); border:1px solid rgba(59,224,168,.45); color:var(--ok);
  font-size:10px; font-weight:700}
.res code{font-family:var(--mono); font-size:10px; color:var(--text-3)}

/* ============================================================
   M 站：<1100，单栏，不展示协作流
   ============================================================ */
@media (max-width:1099px){
  .veil{background:radial-gradient(120% 70% at 50% 30%, rgba(3,5,15,.72) 0%, rgba(3,5,15,.40) 55%, rgba(3,5,15,0) 100%)}
  #boids{opacity:.52}
  .guard{display:none}
  .page{display:flex; flex-direction:column; justify-content:flex-start;
    min-height:100dvh; padding:34px 24px 26px; gap:0}
  .panel{margin:auto 0; max-width:420px; width:100%; align-self:center; padding:6px 0}
  .brand .mk{width:48px; height:48px; flex-basis:48px}
  .totp{gap:8px}
  .totp input{font-size:22px}
  .wordmark{font-size:clamp(26px,7.4vw,33px)}
  .slogan .zh{font-size:15px}
  .slogan .en{font-size:12px; margin-top:6px}
  .rule{margin:20px 0 0}
  .field{margin-top:16px}
  .ver{margin:16px 0 0; text-align:right; padding-bottom:env(safe-area-inset-bottom)}
}
@media (max-width:520px){
  /* 小屏删繁就简：水印缩到角落当氛围，不压表单 */
}
@media (max-width:400px){
  .page{padding:20px 18px 14px}
  .brand{gap:11px}
  .brand .mk{width:44px; height:44px; flex-basis:44px}
  .wordmark{font-size:27px}
  .slogan{margin:10px 0 0}
  .rule{margin:16px 0 0}
  .field{margin-top:14px}
  .keep{margin:12px 0 2px}
  .err{min-height:17px; margin:9px 0 0}
  .btn-main{margin-top:16px}
  .slogan .zh{font-size:14px}
  .totp{gap:6px}
  .totp input{min-height:50px; font-size:19px}
  .keep .tip{display:none}
  .inp input{height:42px; font-size:14px}
  .btn-main{height:46px}
}
@media (min-width:2000px){
  .page{grid-template-columns:minmax(0,1fr) 440px; gap:96px}
  .panel{max-width:440px}
  .wordmark{font-size:clamp(36px,2.4vw,50px)}
  .slogan .zh{font-size:18px}
  .stream{width:460px}
  .totp input{height:72px; font-size:24px}
}
@media (max-height:840px) and (min-width:1100px){
  .page{padding:26px 56px 34px}
  .brand .mk{width:40px; height:40px; flex-basis:40px}
  .wordmark{font-size:clamp(27px,2.3vw,34px)}
  .slogan{margin:10px 0 0}
  .slogan .zh{font-size:14.5px}
  .rule{margin:16px 0 0}
  .field{margin-top:11px}
  .inp input{height:40px}
  .totp{gap:7px}
  .totp input{min-height:50px; font-size:19px}
  .keep{margin:11px 0 2px}
  .err{min-height:16px; margin:8px 0 0}
  .btn-main{height:44px; margin-top:14px}
  .ver{margin:12px 0 0}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
}
.hint{margin:12px 0 0; font-size:11.5px; color:var(--text-3); text-align:center; line-height:1.6}
/* ===== 全宽构图：表单贴右，协作流回左下 ===== */
@media (min-width:1100px){
  .page{max-width:none;margin:0;padding:40px clamp(24px,4vw,72px) 52px;
    grid-template-columns:minmax(0,1fr) clamp(360px,30vw,420px);
    gap:clamp(40px,6vw,120px);align-items:center}
  .panel{grid-column:2;justify-self:end;width:100%;max-width:clamp(360px,30vw,420px)}
  .guard{left:0}
  .veil{background:radial-gradient(48% 62% at 76% 46%, rgba(3,5,15,.90) 0%, rgba(3,5,15,.55) 42%, rgba(3,5,15,0) 72%)}
  .stream{left:clamp(24px,4vw,72px);right:auto;width:420px}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<canvas id="boids" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

        var b = boids[i];
        var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy), spN = Math.min(sp / 1.7, 1);
        var hue = b.hue + spN * 20;
        for (var k = 0; k < 10; k++) {
          var idx = (b.hi - 1 - k + 10) % 10, t = 1 - k / 10;
          drawSprite(spriteFor(hue + k * 2), b.hx[idx], b.hy[idx],
            (3.2 + t * 12) * scale, t * t * 0.34);
        }
        for (var g = 0; g < 2; g++) {
          var ang = time * 0.00055 + b.phase + g * Math.PI;
          var rad = 10 + Math.sin(time * 0.0009 + g * 1.7) * 6;
          drawSprite(spriteFor(hue + 12), b.x + Math.cos(ang) * rad, b.y + Math.sin(ang * 1.25) * rad,
            11 * scale, 0.15);
        }
        drawSprite(spriteFor(hue), b.x, b.y, (16 + spN * 6) * scale, 0.62);
        if (sp > 0.05) {
          var ux = b.vx / sp, uy = b.vy / sp;
          for (var c = 1; c <= 3; c++) {
            drawSprite(spriteFor(hue - 8), b.x - ux * c * 10, b.y - uy * c * 10,
              8 * scale * (1 - c * 0.22), 0.18 * (1 - c * 0.28));
          }
        }
      }
    }

    function render(time) {
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      if (wide) drawRibbons();
      drawLinks();
      drawParticles(time);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (document.hidden) return;
      if (now - lastDraw < 32) return;
      lastDraw = now;
      var dt = Math.min((now - lastT) / 16.667, 3);
      lastT = now;
      update(dt);
      render(now);
    }
    function start() { if (raf) return; lastT = performance.now(); lastDraw = 0; raf = requestAnimationFrame(frame); }
    function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stop(); else start();
    });
    window.addEventListener('resize', function () { resize(); });

    resize();
    if (REDUCE || SHOT) {
      for (var s = 0; s < 220; s++) update(1);
      render(1400);
    } else {
      start();
    }
  })();
})();
</script>
</body>
</html>
